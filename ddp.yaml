services:
  db:
    image: desknest-database-postgresql:latest
    container_name: desknest-database-postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: DeskNest@2025!
      POSTGRES_DB: desknest_db
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
